name: 'Set up the triage runner'
description: >
  Prepares the environment that the triage and revision agents work in: the checkout built as CI
  builds it, with the browsers and the Copilot CLI installed, and a checkout of microsoft/playwright
  to read the client that this repo ports. Exports PLAYWRIGHT_DIR, the path of that checkout, and
  CI_ENV_EXEC, the wrapper from microsoft/playwright that runs a command under xvfb on Linux and at
  normal I/O priority on Windows.
runs:
  using: composite
  steps:
  - uses: microsoft/playwright/.github/actions/ci-env@main
  - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
    with:
      distribution: zulu
      java-version: 8
  - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version: '24'
  - name: Download the driver, build and install
    shell: bash
    run: |
      scripts/download_driver.sh
      mvn -B install -D skipTests --no-transfer-progress
  - name: Install the browsers
    shell: bash
    run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps" -f playwright/pom.xml --no-transfer-progress
  - name: Check out microsoft/playwright
    shell: bash
    run: |
      dir="${RUNNER_TEMP//\\//}/playwright"
      git clone --quiet --depth 1 https://github.com/microsoft/playwright "$dir"
      echo "PLAYWRIGHT_DIR=$dir" >> "$GITHUB_ENV"
  - name: Install the Copilot CLI
    shell: bash
    run: npm install -g @github/copilot
